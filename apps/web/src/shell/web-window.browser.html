<!doctype html>
<html lang="en" data-surface="deck" class="dark" style="height:100%">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A browser window</title>
  <body class="dashboard-scope" style="height:100%;margin:0">
    <div id="web-window" style="height:100%"></div>
    <pre id="result" role="status" style="position:fixed;right:8px;bottom:6px;margin:0;font-size:11px;opacity:.55;pointer-events:none;z-index:100">Running…</pre>
    <!-- A window Cloud serves opens on New chat (panes/store.ts homePath); the tab store reads the route as it loads. -->
    <script>
      if (!location.hash) history.replaceState(null, "", location.pathname + location.search + "#/new");
    </script>
    <script type="module" src="./web-window.browser.tsx"></script>
  </body>
</html>
