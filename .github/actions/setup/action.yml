name: Setup
description: pnpm, Node 24 with the pnpm store cached, and the workspace installed from the lockfile.
runs:
  using: composite
  steps:
    # Pinned by commit, Node 24 majors: the floating @v4 of pnpm/action-setup ran on Node 20 and warned on every job.
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 24
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
