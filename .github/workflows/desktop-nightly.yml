# Nightly desktop builds from main for the Nightly update channel,
# https://download.caveman.so/code/nightly/mac and /code/nightly/win
# (apps/desktop/src/updates/updateChannels.ts). Every day and by hand.
#
# It publishes only when the repository variable NIGHTLY_ENABLED is `true`:
# merging this file publishes nothing. Until then each run is a packaging check
# of main (ad-hoc signed, smoked, kept as a run artifact), and uses no secret.
# Once enabled, the builds are signed and notarized as releases are (the
# secrets desktop-release.yml lists), smoked, and copied into the bucket under
# versioned names; latest-mac.yml (and latest.yml) moves last, and only to a
# version newer than the one it names. No draft, tag or GitHub release: a
# nightly's notes are its commit subjects (release-notes.mjs nightly), in its
# feed for Settings > General and in the run summary. Stable releases still need
# finished notes (desktop-release.yml).
#
# Version: <next>-nightly.<YYYYMMDD>.<run> (apps/desktop/scripts/nightly-version.mjs),
# which sorts below the release it leads to: a Mac switched back to Stable keeps
# its nightly until that release ships, never an older one.
# Actions are pinned by commit: the build job may hold the signing secrets.
name: Desktop nightly

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Version and notes
    runs-on: ubuntu-24.04
    outputs:
      # Every job builds this commit: main may move while the run goes.
      sha: ${{ steps.sha.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.publish.outputs.publish }}
      windows: ${{ steps.windows.outputs.build || 'false' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          # The desktop-v* tags pick the release the nightly leads to.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Version
        id: version
        env:
          RUN: ${{ github.run_number }}
        run: |
          VERSION="$(node apps/desktop/scripts/nightly-version.mjs "$RUN")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "## Caveman Code $VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Notes from the commits
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node apps/desktop/scripts/release-notes.mjs nightly "$VERSION" > nightly-notes.md
          cat nightly-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-notes
          path: nightly-notes.md
          if-no-files-found: error
      - name: Publish or only build
        id: publish
        env:
          ENABLED: ${{ vars.NIGHTLY_ENABLED }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "NIGHTLY_ENABLED is not \`true\`: built and smoked only, nothing published." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Secrets reach a step only when publishing.
      - name: R2 secrets are set
        if: steps.publish.outputs.publish == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          [[ -n "$R2_ACCOUNT_ID" && -n "$R2_ACCESS_KEY_ID" && -n "$R2_SECRET_ACCESS_KEY" ]] || { echo "::error::NIGHTLY_ENABLED is true but the R2 secrets are not set"; exit 1; }
      # As desktop-release.yml: Windows ships only signed, so it builds only when publishing with its secrets set.
      - name: Is Windows signing set up
        id: windows
        if: steps.publish.outputs.publish == 'true'
        env:
          AZURE: ${{ secrets.AZURE_TENANT_ID }}${{ secrets.AZURE_CLIENT_ID }}${{ secrets.AZURE_CLIENT_SECRET }}${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          if [ -n "$AZURE" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  build:
    name: Build ${{ matrix.arch }}
    needs: plan
    strategy:
      matrix:
        # Each arch builds under a Node of its own arch: the runtime bundle carries the natives that Node installed. Both on
        # Apple silicon, x64 under Rosetta: the Intel runners took twice as long and queued longest.
        arch: [arm64, x64]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # The x64 build's Node, and everything it starts (pnpm, the runtime bundle, electron-builder, the smoke), runs under
      # Rosetta.
      - name: Rosetta
        if: matrix.arch == 'x64'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - run: test "$(node -p process.arch)" = "${{ matrix.arch }}" && pnpm install --frozen-lockfile
      # The updater's machine, channels and release scripts, before an hour of packaging. Once, on arm64: they are the
      # same for both arches, and under Rosetta their many short Node processes run past their timeouts.
      - if: matrix.arch == 'arm64'
        run: pnpm --filter @caveman-app/desktop test
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-notes
          path: ${{ runner.temp }}/notes
      - name: Signing material
        if: needs.plan.outputs.publish == 'true'
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
      - name: Package, sign, notarize
        if: needs.plan.outputs.publish == 'true'
        env:
          CAVEMAN_APP_VERSION: ${{ needs.plan.outputs.version }}
          # Crash reports (docs/): the DSN, public, is baked into the app; the token uploads its
          # source maps to that Sentry project. Unset, the build reports nothing.
          CAVEMAN_CRASH_DSN: ${{ vars.CAVEMAN_CRASH_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          CAVEMAN_RELEASE_NOTES_FILE: ${{ runner.temp }}/notes/nightly-notes.md
          CSC_LINK: ${{ runner.temp }}/developer-id.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node apps/desktop/scripts/package.mjs --release
      - name: Package (ad-hoc, not published)
        if: needs.plan.outputs.publish != 'true'
        env:
          CAVEMAN_APP_VERSION: ${{ needs.plan.outputs.version }}
          CAVEMAN_RELEASE_NOTES_FILE: ${{ runner.temp }}/notes/nightly-notes.md
        run: node apps/desktop/scripts/package.mjs
      - name: Smoke the packaged app
        run: node apps/desktop/scripts/smoke-test.mjs --packaged
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-notes
          path: ${{ runner.temp }}/notes
      - name: Package and sign
        env:
          CAVEMAN_APP_VERSION: ${{ needs.plan.outputs.version }}
          # Crash reports (docs/): the DSN, public, is baked into the app; the token uploads its
          # source maps to that Sentry project. Unset, the build reports nothing.
          CAVEMAN_CRASH_DSN: ${{ vars.CAVEMAN_CRASH_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          CAVEMAN_RELEASE_NOTES_FILE: ${{ runner.temp }}/notes/nightly-notes.md
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: node apps/desktop/scripts/package.mjs --release
      - name: Smoke the packaged app
        run: node apps/desktop/scripts/smoke-test.mjs --packaged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-win-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  publish:
    name: Publish to the Nightly feed
    needs: [plan, build, build-windows]
    # Only when enabled; Windows is skipped when its signing is not set up, and a failed build stops it.
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && needs.build.result == 'success' && (needs.build-windows.result == 'success' || (needs.build-windows.result == 'skipped' && needs.plan.outputs.windows == 'false')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Merge update manifests
        run: node apps/desktop/scripts/merge-update-manifests.mjs artifacts/nightly-arm64/latest-mac.yml artifacts/nightly-x64/latest-mac.yml > latest-mac.yml
      - name: Upload, then move the feed
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]] || { echo "::error::$VERSION is not a nightly version"; exit 1; }
          s3() { aws s3 --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" "$@"; }
          bucket=s3://caveman-downloads/code/nightly/mac
          winbucket=s3://caveman-downloads/code/nightly/win
          # The feed never goes back: refuse a version that is not above the one it serves.
          # Only a missing feed reads as none: any other error stops, so a failed read never moves it back.
          if head=$(aws s3api head-object --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --bucket caveman-downloads --key code/nightly/mac/latest-mac.yml 2>&1); then
            s3 cp "$bucket/latest-mac.yml" current-mac.yml
            current="current-mac.yml"
          elif grep -qE '\(404\)|Not Found|NoSuchKey' <<< "$head"; then
            current="-"
          else
            echo "::error::could not read the Nightly feed: $head"
            exit 1
          fi
          node apps/desktop/scripts/nightly-version.mjs check "$VERSION" "$current"
          for file in artifacts/nightly-{arm64,x64}/*.dmg artifacts/nightly-{arm64,x64}/*.zip artifacts/nightly-{arm64,x64}/*.blockmap; do
            s3 cp "$file" "$bucket/${file##*/}" --cache-control "public, max-age=31536000, immutable"
          done
          for arch in arm64 x64; do
            s3 cp "$bucket/Caveman-Code-$VERSION-$arch.dmg" "$bucket/Caveman-Code-$arch.dmg" \
              --metadata-directive REPLACE --content-type application/x-apple-diskimage --cache-control "public, max-age=300"
          done
          if [ -d artifacts/nightly-win-x64 ]; then
            for file in artifacts/nightly-win-x64/*.exe artifacts/nightly-win-x64/*.blockmap; do
              s3 cp "$file" "$winbucket/${file##*/}" --cache-control "public, max-age=31536000, immutable"
            done
            s3 cp "$winbucket/Caveman-Code-Setup-$VERSION-x64.exe" "$winbucket/Caveman-Code-Setup-x64.exe" \
              --metadata-directive REPLACE --content-type application/vnd.microsoft.portable-executable --cache-control "public, max-age=300"
          fi
          # Last: installed apps on Nightly act on these.
          s3 cp latest-mac.yml "$bucket/latest-mac.yml" --content-type text/yaml --cache-control "no-cache"
          echo "Published: https://download.caveman.so/code/nightly/mac/latest-mac.yml" >> "$GITHUB_STEP_SUMMARY"
          if [ -d artifacts/nightly-win-x64 ]; then
            s3 cp artifacts/nightly-win-x64/latest.yml "$winbucket/latest.yml" --content-type text/yaml --cache-control "no-cache"
            echo "and https://download.caveman.so/code/nightly/win/latest.yml" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ADEMark's cold start, memory at rest and idle CPU (A1, A5, A6) on the nightly arm64 build, beside the build so it
  # holds no signing secret (apps/desktop/scripts/ademark/README.md). Report only for now: budgets.json still holds
  # placeholders, and the first runs here give Caveman Code's own numbers to set them from. Then add --check, and a
  # regression fails the nightly. A1 is a time, so --check holds it only on budgets.json `machine`.
  ademark:
    name: ADEMark A1, A5, A6 (arm64)
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ADEMark's replay server and sampler run on Bun; its native helper builds with the Xcode Swift the runner has.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-arm64
          path: ${{ runner.temp }}/nightly
      - name: Unpack the app
        run: |
          zip=$(ls "$RUNNER_TEMP"/nightly/*arm64*.zip | head -1)
          ditto -x -k "$zip" "$RUNNER_TEMP/app"
          test -x "$RUNNER_TEMP/app/Caveman Code.app/Contents/MacOS/Caveman Code"
      - name: ADEMark
        run: node apps/desktop/scripts/ademark/run.ts --tests A1,A5 --app "$RUNNER_TEMP/app/Caveman Code.app" --out "$RUNNER_TEMP/ademark/results.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ademark-arm64
          path: ${{ runner.temp }}/ademark/
          if-no-files-found: ignore
