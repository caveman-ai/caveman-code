name: Wallpaper library

on:
  pull_request:
    paths:
      - wallpapers/**
      - apps/web/src/state/wallpaper-library.json
      - scripts/publish-wallpapers.mjs
      - .github/workflows/wallpaper-library.yml
  push:
    branches: [main]
    paths:
      - wallpapers/**
      - apps/web/src/state/wallpaper-library.json
      - scripts/publish-wallpapers.mjs
      - .github/workflows/wallpaper-library.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallpaper-library-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify wallpaper pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/publish-wallpapers.mjs
      - run: node --test wallpapers/edge.test.mjs
  publish:
    name: Publish wallpaper pack
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish immutable pictures
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          node scripts/publish-wallpapers.mjs --upload
      - name: Check public image delivery
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const art=JSON.parse(readFileSync('apps/web/src/state/wallpaper-library.json'))[0];
          const response=await fetch('https://download.caveman.so/code/wallpapers/v1/'+art.file,{headers:{Origin:'https://app.caveman.so'}});
          if (!response.ok || response.headers.get('access-control-allow-origin') !== '*') throw new Error('Public wallpaper delivery or CORS failed');
          const bytes=await response.arrayBuffer();
          if(bytes.byteLength !== art.bytes) throw new Error('Public wallpaper bytes differ');
          console.log('Public wallpaper delivery verified.');
          JS
