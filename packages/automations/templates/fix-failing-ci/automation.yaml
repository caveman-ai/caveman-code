# yaml-language-server: $schema=https://caveman.so/schemas/automation-v1.json
version: 1
description: When CI fails on the default branch, find the cause and open a draft fix

on:
  github:
    event: workflow_run.completed
    conclusion: failure

budget: $4

steps:
  diagnose:
    agent: ci-triage              # decides fix, flaky or skip
    model: fast
  fix:
    if: { diagnose: fix }
    agent: builder
    model: base
    escalate: frontier
    computer: full
    checks:
      # Add the command that failed in CI here, so the fix must pass it before the reviewer reads it:
      # - pnpm test
      - agent: reviewer
    retries: 1

outputs:
  github.pull_request: { from: fix, draft: true }
